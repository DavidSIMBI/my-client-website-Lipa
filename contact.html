<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact the LipaGo student marketplace team.">
    <title>Contact LipaGo | Student Marketplace</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="site-header">
        <div class="container header-content">
            <a class="brand" href="index.html" aria-label="LipaGo home">Lipa<span>Go</span></a>
            <nav aria-label="Main navigation">
                <ul class="nav-list">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a class="active" href="contact.html" aria-current="page">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container page-content">
        <section class="page-intro" aria-labelledby="contact-title">
            <p class="eyebrow">Get in touch</p>
            <h1 id="contact-title">Contact LipaGo</h1>
            <p>Have a question, suggestion, or idea for the student marketplace? Send us a message below.</p>
        </section>

        <section class="section form-section" aria-labelledby="form-heading">
            <h2 id="form-heading">Send us a message</h2>
            <form action="#" method="post">
                <div class="form-group">
                    <label for="full-name">Full name</label>
                    <input type="text" id="full-name" name="full-name" autocomplete="name" required>
                </div>

                <div class="form-group">
                    <label for="email">Email address</label>
                    <input type="email" id="email" name="email" autocomplete="email" required>
                </div>

                <div class="form-group">
                    <label for="phone">Phone number</label>
                    <input type="tel" id="phone" name="phone" autocomplete="tel" required>
                </div>

                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="6" required></textarea>
                </div>

                <button class="button" type="submit">Send message</button>
            </form>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>&copy; 2026 LipaGo. A student marketplace prototype.</p>
        </div>
    </footer>
</body>
</html>
